# Админка Pages CMS (https://app.pagescms.org). Мама входит по почте, без GitHub: см. docs/ДЛЯ-МАМЫ.md.
media:
  - name: photos
    label: Фотографии
    input: src/assets/uploads
    output: /src/assets/uploads
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
settings:
  # Служебная страница настроек маме не нужна.
  hide: true
  commit:
    # В истории видно, кто из нас что поменял.
    identity: user
    templates:
      create: 'Админка: добавлено {filename} ({userName})'
      update: 'Админка: изменено {filename} ({userName})'
      delete: 'Админка: удалено {filename} ({userName})'
      rename: 'Админка: переименовано {oldFilename} → {newFilename} ({userName})'
content:
  - name: works
    label: Работы
    type: collection
    path: src/content/works
    format: json
    filename: '{fields.slug}.json'
    view:
      fields: [title, category, price, published, featured]
      primary: title
      search: [title, description]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Название работы
        type: string
        required: true
        description: 'Как работа будет подписана на сайте. Например: Сумка-корзина.'
      - name: slug
        label: Адрес страницы (латиницей, через дефис)
        type: string
        required: true
        description: 'Название латинскими буквами, вместо пробелов дефис. Например: sumka-korzina. После публикации не меняйте.'
      - name: category
        label: Техника
        type: select
        required: true
        options:
          values: [Макраме, Вязание, Плетение]
      - name: images
        label: Фотографии
        description: 'Первая фотография станет обложкой. Порядок можно менять перетаскиванием.'
        type: object
        list:
          min: 1
          max: 12
          collapsible:
            summary: '{fields.alt}'
        fields:
          - name: src
            label: Фотография
            type: image
            required: true
          - name: alt
            label: Что на фотографии (пара слов)
            type: string
            required: true
            description: 'Например: Сумка на плече, вид сбоку. Это подпись для тех, кто плохо видит, и для поиска.'
      - name: description
        label: Описание
        type: text
        required: true
        description: 'Пара предложений: из чего, размер, для чего подойдёт.'
      - name: price
        label: Цена (можно не заполнять)
        type: string
        description: 'Например: 2 500 ₽. Пусто — цена на сайте не показывается.'
      - name: availability
        label: Наличие (можно не выбирать)
        type: select
        options:
          values: [Есть в наличии, Изготовление под заказ, Сейчас недоступно, Продано]
      - name: published
        label: Показывать на сайте
        type: boolean
        default: false
        description: 'Пока выключено, работа — черновик и на сайте её не видно.'
      - name: featured
        label: Показывать на главной
        type: boolean
        default: false
        description: 'На главной показывается одна работа: первая по порядку из отмеченных.'
      - name: order
        label: Порядок (меньше число — выше)
        type: number
        default: 100
        description: '10 будет выше 20. Удобно давать числа с шагом 10, чтобы потом вставлять между ними.'
      - name: vkUrl
        label: Товар в VK
        type: string
        hidden: true
      - name: vkId
        label: Номер товара VK
        type: number
        hidden: true
  - name: site
    label: Тексты сайта
    type: file
    path: src/content/site.json
    format: json
    operations:
      delete: false
      rename: false
    fields:
      - {name: name, label: Название мастерской (не менять), type: string, required: true, hidden: true}
      - {name: tagline, label: Техники на первом экране, type: string, required: true}
      - {name: heroNote, label: Подпись под главной кнопкой, type: string, required: true}
      - {name: introTitle, label: Заголовок над избранной работой, type: string, required: true}
      - {name: introText, label: Подпись к избранной работе, type: text, required: true}
      - {name: aboutTitle, label: Заголовок «О мастерской», type: string, required: true}
      - {name: aboutText, label: Текст «О мастерской», type: text, required: true}
      - {name: contactTitle, label: Заголовок контактов, type: string, required: true}
      - {name: contactText, label: Текст контактов, type: text, required: true}
      - {name: vkUrl, label: Ссылка на сообщество VK, type: string, required: true}
